<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGMHSS NEWS</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
  body {
    font-family: "Segoe UI", sans-serif;
    background: #f8fbff;
    color: #111;
    margin: 0;
    padding: 0;
  }
  header {
    background: #2b6bff;
    color: #fff;
    padding: 15px;
    font-size: 22px;
    font-weight: bold;
    text-align: center;
  }
  #controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 15px;
  }
  button, select, input[type=range] {
    font-size: 15px;
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
  }
  button {
    background: #2b6bff;
    color: white;
    border: none;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  #news {
    max-width: 800px;
    margin: auto;
    padding: 10px;
  }
  section { margin-top: 25px; }
  h2 { border-bottom: 2px solid #ddd; padding-bottom: 4px; }
  article {
    display: flex;
    gap: 10px;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 8px;
    background: white;
    margin-bottom: 10px;
  }
  article img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 6px;
  }
  .meta {
    font-size: 12px;
    color: #555;
  }
  a { color: #2b6bff; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .error-msg { color: #d32f2f; text-align: center; font-weight: bold; }
</style>
</head>
<body>
<header>🗞️ AGMHSS DAILY NEWS 🗞️</header>

<div id="controls">
  <button id="playBtn">▶ Play</button>
  <button id="pauseBtn">⏸ Pause</button>
  <button id="resumeBtn">⏵ Resume</button>
  <button id="stopBtn">⏹ Stop</button>
  <label>Speed:
    <input id="speedRange" type="range" min="0.7" max="1.3" step="0.05" value="0.95" />
    <span id="speedLabel">0.95×</span>
  </label>
  <button id="pdfBtn">💾 Save as PDF</button>
</div>

<div id="news"><p style="text-align: center;">Loading authentic sources…</p></div>

<script>
// Updated to highly reliable RSS feeds
const FEEDS = {
  regional: ["https://www.thehindu.com/news/national/tamil-nadu/feeder/default.rss"],
  national: ["https://timesofindia.indiatimes.com/rssfeedstopstories.cms"],
  international: ["https://feeds.bbci.co.uk/news/world/rss.xml"]
};

const MIX = { regional: 0.5, national: 0.3, international: 0.2 };
const TOTAL = 10;

// --- Helpers ---
function stripHtml(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  return (div.textContent || div.innerText || "").replace(/\s+/g, " ").trim();
}

function parseFirstImg(html) {
  const div = document.createElement("div");
  div.innerHTML = html || "";
  const img = div.querySelector("img");
  return img ? img.src : "";
}

// --- Student-friendly filter ---
function filterStudentNews(arr) {
  const badWords = [
    "murder","kill","shot","violence","rape","abuse",
    "theft","robbery","stolen","crime","arrest","assault",
    "politics","election","party","campaign","protest","scam",
    "terror","bomb","attack","court","hijack","fraud","surrender"
  ];

  const goodWords = [
    "education","students","school","exam","competition","scholarship",
    "sports","match","tournament","victory","medal","championship",
    "science","technology","space","isro","nasa","research",
    "award","achievement","innovation","discovery","environment",
    "astronomy","robotics","health","youth","children"
  ];

  return arr.filter(n => {
    const text = (n.title + " " + n.description).toLowerCase();
    if (badWords.some(b => text.includes(b))) return false;
    if (goodWords.some(g => text.includes(g))) return true;
    return true; // allow neutral news
  });
}

// --- Robust RSS Fetch using RSS2JSON ---
async function parseRSS(url) {
  try {
    // RSS2JSON API handles the XML-to-JSON conversion reliably and bypasses CORS
    const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}`;
    const res = await fetch(apiUrl);
    
    if (!res.ok) throw new Error("Network response was not ok");
    const data = await res.json();
    
    if (data.status !== 'ok') throw new Error("RSS API failed to parse feed");

    return data.items.map((it, i) => ({
      id: url + "#" + i,
      title: stripHtml(it.title || ""),
      description: stripHtml(it.description || ""),
      link: it.link || "",
      pubDate: it.pubDate || "",
      // Extracts image from thumbnail, enclosure, or directly from the HTML content
      image: it.thumbnail || (it.enclosure && it.enclosure.link) || parseFirstImg(it.content || it.description) || "",
      source: new URL(url).host
    }));
  } catch (e) {
    console.warn("Feed failed to load:", url, e);
    return [];
  }
}

async function loadAll() {
  const lists = await Promise.all([
    parseRSS(FEEDS.regional[0]),
    parseRSS(FEEDS.national[0]),
    parseRSS(FEEDS.international[0])
  ]);

  const dedupe = (arr, lim) => {
    const seen = new Set();
    const out = [];
    for (const a of arr) {
      const k = a.title.toLowerCase();
      if (!seen.has(k)) {
        seen.add(k);
        out.push(a);
        if (out.length >= lim) break;
      }
    }
    return out;
  };

  return {
    regional: filterStudentNews(dedupe(lists[0], Math.round(TOTAL * MIX.regional) || 5)),
    national: filterStudentNews(dedupe(lists[1], Math.round(TOTAL * MIX.national) || 3)),
    international: filterStudentNews(dedupe(lists[2], Math.round(TOTAL * MIX.international) || 2))
  };
}

// --- Rendering ---
function renderNews(all) {
  const container = document.getElementById("news");
  container.innerHTML = "";
  
  if (!all.regional.length && !all.national.length && !all.international.length) {
      container.innerHTML = "<p class='error-msg'>Feeds are currently unavailable. Please refresh or try again later.</p>";
      return;
  }

  const createSection = (title, arr) => {
    if (!arr || arr.length === 0) return; // Hide section if no valid news
    const sec = document.createElement("section");
    const h2 = document.createElement("h2");
    h2.textContent = title;
    sec.appendChild(h2);
    
    arr.forEach(a => {
      const art = document.createElement("article");
      if (a.image) {
        const img = document.createElement("img");
        img.src = a.image;
        img.onerror = () => img.remove();
        art.appendChild(img);
      }
      const div = document.createElement("div");
      div.innerHTML = `
        <div class='meta'>${a.source} ${a.pubDate ? "• " + new Date(a.pubDate).toLocaleString() : ""}</div>
        <h3>${a.title}</h3>
        <p>${a.description}</p>
        <a href='${a.link}' target='_blank'>Read more ↗</a>`;
      art.appendChild(div);
      sec.appendChild(art);
    });
    container.appendChild(sec);
  };
  
  createSection("Regional – Tamil Nadu", all.regional);
  createSection("National – India", all.national);
  createSection("International", all.international);
}

// --- Voice Setup ---
let allVoices = [];
function loadVoices() { allVoices = window.speechSynthesis.getVoices(); }
window.speechSynthesis.onvoiceschanged = loadVoices;

function getVoice(gender) {
  if (!allVoices.length) loadVoices();
  const femaleNames = ["Google UK English Female","Microsoft Zira","Samantha","Neerja"];
  const maleNames = ["Google UK English Male","Microsoft David","Alex","Heera"];
  const list = gender === "male" ? maleNames : femaleNames;
  return allVoices.find(v => list.some(n => v.name.includes(n))) ||
         allVoices.find(v => v.lang.startsWith("en")) || allVoices[0];
}

// --- Script Builder ---
function buildScript(n) {
  const date = new Date().toLocaleDateString("en-IN",{year:"numeric",month:"long",day:"numeric"});
  const script = [
    { gender: "female", text: `Good day. This is your AGMHSS Daily News bulletin for ${date}.` }
  ];

  if (n.regional.length) {
      script.push({ gender: "male", text: `Regional News – Tamil Nadu.` });
      n.regional.forEach((a, i) => script.push({gender:"male", text:`${i+1}. ${a.title}. ${a.description.split(/[.?!]/)[0]}.`}));
  }

  if (n.national.length) {
      script.push({ gender: "female", text: `National News – India.` });
      n.national.forEach((a, i) => script.push({gender:"female", text:`${i+1}. ${a.title}. ${a.description.split(/[.?!]/)[0]}.`}));
  }

  if (n.international.length) {
      script.push({ gender: "male", text: `International Headlines.` });
      n.international.forEach((a, i) => script.push({gender:"male", text:`${i+1}. ${a.title}. ${a.description.split(/[.?!]/)[0]}.`}));
  }

  script.push({ gender: "female", text: `That concludes the AGMHSS Daily News bulletin. Have a great day ahead!` });
  return script;
}

// --- Speak ---
function speakNews(news, rate) {
  window.speechSynthesis.cancel();
  const parts = buildScript(news);
  const maleVoice = getVoice("male");
  const femaleVoice = getVoice("female");

  parts.forEach(p => {
    const u = new SpeechSynthesisUtterance(p.text);
    u.lang = "en-IN";
    u.voice = p.gender === "male" ? maleVoice : femaleVoice;
    u.rate = rate;
    u.pitch = p.gender === "male" ? 1.0 : 1.15;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  });
}

// --- PDF ---
function saveAsPDF(news) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "a4" });

  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 50;
  const maxW = pageW - margin * 2;

  const date = new Date().toLocaleDateString("en-IN", {
    year: "numeric",
    month: "long",
    day: "numeric",
  });

  doc.setFont("helvetica", "bold");
  doc.setFontSize(18);
  const title = `AGMHSS Daily News – ${date}`;
  const titleWidth = doc.getTextWidth(title);
  let y = margin + 10;
  doc.text(title, (pageW - titleWidth) / 2, y);
  y += 25;

  const textBlocks = [];
  const add = (label, arr) => {
    if (!arr || !arr.length) return;
    textBlocks.push({ text: label, size: 14, bold: true });
    arr.forEach((a, i) => {
      textBlocks.push({ text: `${i + 1}. ${a.title}`, size: 11, bold: true });
      if (a.description) textBlocks.push({ text: a.description, size: 10, bold: false });
    });
    textBlocks.push({ text: " ", size: 4, bold: false });
  };
  
  add("Regional – Tamil Nadu", news.regional);
  add("National – India", news.national);
  add("International", news.international);

  let lines = [];
  const maxLineWidth = maxW;
  textBlocks.forEach(block => {
    doc.setFont("helvetica", block.bold ? "bold" : "normal");
    doc.setFontSize(block.size);
    const wrapped = doc.splitTextToSize(block.text, maxLineWidth);
    wrapped.forEach(line => lines.push({ text: line, size: block.size, bold: block.bold }));
  });

  const topSpace = y;
  const bottomSpace = margin + 20;
  const usableHeight = pageH - topSpace - bottomSpace;
  const totalTextHeight = lines.reduce((sum, l) => sum + l.size + 2, 0);
  const extraSpace = usableHeight - totalTextHeight;
  const lineGap = extraSpace > 0 ? extraSpace / lines.length : 0;

  lines.forEach(line => {
    if (y > pageH - margin) return;
    doc.setFont("helvetica", line.bold ? "bold" : "normal");
    doc.setFontSize(line.size);
    doc.text(line.text, margin, y);
    y += line.size + 2 + lineGap;
  });

  doc.save(`AGMHSS_News_${date.replace(/\s+/g, "_")}.pdf`);
}

// --- Init ---
(async ()=>{
  try {
    const all = await loadAll();
    renderNews(all);
    
    const play = document.getElementById('playBtn'),
          pause = document.getElementById('pauseBtn'),
          resume = document.getElementById('resumeBtn'),
          stop = document.getElementById('stopBtn'),
          speed = document.getElementById('speedRange'),
          label = document.getElementById('speedLabel'),
          pdfBtn = document.getElementById('pdfBtn');

    let rate = parseFloat(speed.value);
    speed.oninput = () => { rate = parseFloat(speed.value); label.textContent = rate.toFixed(2) + '×'; };
    play.onclick = () => speakNews(all, rate);
    pause.onclick = () => speechSynthesis.pause();
    resume.onclick = () => speechSynthesis.resume();
    stop.onclick = () => speechSynthesis.cancel();
    pdfBtn.onclick = () => saveAsPDF(all);

  } catch (e) {
    document.getElementById("news").innerHTML =
      "<p class='error-msg'>Failed to load news feeds. Please try again later.</p>";
  }
})();
</script>
</body>
</html>
